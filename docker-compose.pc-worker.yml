services:
  chris-pc-2-ollama:
    image: ollama/ollama:latest
    container_name: local-llm-chris-pc-2-ollama
    restart: unless-stopped
    gpus: all
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - chris_pc_2_ollama:/root/.ollama

volumes:
  chris_pc_2_ollama:
    name: local_llm_chris_pc_2_ollama
    external: true
