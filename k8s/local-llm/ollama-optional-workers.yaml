apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-optional-workers
  namespace: local-llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: inference
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/component: inference
      local-llm.io/pool: optional
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: inference
        local-llm.io/pool: optional
        local-llm.io/interruptible: "true"
    spec:
      nodeSelector:
        local-llm.io/optional: "true"
        local-llm.io/ollama: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              hostPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 10m
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: ollama-data
          hostPath:
            path: /var/lib/local-llm/ollama
            type: DirectoryOrCreate
