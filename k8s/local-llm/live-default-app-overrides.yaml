apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-llm-backend
  namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-llm-routing
  namespace: default
data:
  OLLAMA_BACKENDS: |
    {"backends":[{"name":"mac-mini","url":"http://host.lima.internal:11434","priority":20,"weight":1,"enabled":true,"essential":true,"labels":{"host":"mac-mini"}},{"name":"chris-pc-2","url":"http://192.168.4.24:11434","priority":5,"weight":3,"enabled":true,"essential":false,"models":["llama3.2:3b"],"labels":{"host":"CHRIS-PC-2","gpu":"RTX 5070","vram":"12GB","pool":"external"}}],"model_preferences":{"llama3.2:3b":["chris-pc-2","mac-mini"]}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-llm-default-backend-worker-control
  namespace: local-llm
subjects:
  - kind: ServiceAccount
    name: local-llm-backend
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-llm-backend-worker-control
