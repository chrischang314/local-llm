apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-llm-agent-runner
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: agent-runner
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-llm-agent-runner
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: agent-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-llm
      app.kubernetes.io/component: agent-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-llm
        app.kubernetes.io/component: agent-runner
    spec:
      serviceAccountName: local-llm-agent-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runner
          image: ghcr.io/chrischang314/local-llm/agent-runner:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUNNER_ACCESS_REQUIRED
              value: "true"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: local-llm-agent-runner-auth
                  key: token
            - name: RUNNER_WORKSPACE
              value: /workspace
            - name: RUNNER_TMPDIR
              value: /tmp
            - name: RUNNER_COMMAND_PATH
              value: /usr/local/bin:/usr/bin:/bin
            - name: RUNNER_ALLOWED_COMMANDS
              value: python,python3,pytest,git,rg
            - name: RUNNER_ALLOWED_ENV
              value: PYTHONPATH,PYTHONUNBUFFERED,NO_COLOR
            - name: RUNNER_DEFAULT_TIMEOUT_SECONDS
              value: "30"
            - name: RUNNER_MAX_TIMEOUT_SECONDS
              value: "60"
            - name: RUNNER_MAX_STDIN_BYTES
              value: "65536"
            - name: RUNNER_MAX_OUTPUT_BYTES
              value: "65536"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: local-llm-agent-runner
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: agent-runner
spec:
  selector:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: agent-runner
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-llm-agent-runner-isolation
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: agent-runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: local-llm
      app.kubernetes.io/component: agent-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: local-llm
              app.kubernetes.io/component: backend
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: local-llm
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
  egress: []
