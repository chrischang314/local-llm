apiVersion: v1
kind: ServiceAccount
metadata:
  name: chris-pc-1-worker-controller
  namespace: local-llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chris-pc-1-worker-controller
  namespace: local-llm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["chris-pc-1-ollama-switch"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chris-pc-1-worker-controller
  namespace: local-llm
subjects:
  - kind: ServiceAccount
    name: chris-pc-1-worker-controller
    namespace: local-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chris-pc-1-worker-controller
---
apiVersion: v1
kind: Secret
metadata:
  name: chris-pc-1-worker-controller-token
  namespace: local-llm
  annotations:
    kubernetes.io/service-account.name: chris-pc-1-worker-controller
type: kubernetes.io/service-account-token
