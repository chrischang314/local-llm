apiVersion: apps/v1
kind: Deployment
metadata:
  name: chris-pc-2-ollama-switch
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: external-worker-switch
    local-llm.io/worker: chris-pc-2
    local-llm.io/optional: "true"
  annotations:
    local-llm.io/control-help: "Scale replicas to 1 to enable CHRIS-PC-2 Ollama, or 0 to disable it for gaming."
    local-llm.io/controlled-by: "scripts/local-ollama-worker-controller.ps1 running on CHRIS-PC-2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-llm
      app.kubernetes.io/component: external-worker-switch
      local-llm.io/worker: chris-pc-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-llm
        app.kubernetes.io/component: external-worker-switch
        local-llm.io/worker: chris-pc-2
        local-llm.io/optional: "true"
    spec:
      containers:
        - name: switch
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 5m
              memory: 16Mi
---
