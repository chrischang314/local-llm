apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-llm-backend
  namespace: local-llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-llm-backend-worker-control
  namespace: local-llm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-llm-backend-worker-control
  namespace: local-llm
subjects:
  - kind: ServiceAccount
    name: local-llm-backend
    namespace: local-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-llm-backend-worker-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-llm-backend
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-llm
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-llm
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: local-llm-backend
      hostAliases:
        - ip: 192.168.5.2
          hostnames:
            - host.lima.internal
      containers:
        - name: backend
          image: ghcr.io/chrischang314/local-llm/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OLLAMA_BACKENDS_FILE
              value: /app/config/backends.json
            - name: AGENT_RUNNER_URL
              value: http://local-llm-agent-runner.local-llm.svc.cluster.local:8080
            - name: WEB_RESEARCH_ENABLED
              value: "true"
            - name: WEB_RESEARCH_PROVIDER
              value: mojeek
            - name: WEB_RESEARCH_FETCH_PAGES
              value: "false"
            - name: AGENT_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: local-llm-agent-runner-auth
                  key: token
                  optional: true
          volumeMounts:
            - name: ollama-backends
              mountPath: /app/config
              readOnly: true
            - name: chat-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ollama-backends
          configMap:
            name: ollama-backends
        - name: chat-data
          persistentVolumeClaim:
            claimName: local-llm-chat-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-llm-chat-data
  namespace: local-llm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: local-llm-backend
  namespace: local-llm
spec:
  selector:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
