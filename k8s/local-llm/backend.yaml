apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-llm-backend
  namespace: local-llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-llm-backend-worker-control
  namespace: local-llm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-llm-backend-worker-control
  namespace: local-llm
subjects:
  - kind: ServiceAccount
    name: local-llm-backend
    namespace: local-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-llm-backend-worker-control
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-llm-shared-auth-nfs
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: shared-auth-nfs
    namespace: local-llm
  nfs:
    path: /volume1/k8s/default-shared-auth-nfs-pvc-71676129-75e8-40eb-a36b-cb0569f5c55e
    server: 192.168.4.33
  persistentVolumeReclaimPolicy: Retain
  storageClassName: synology-nfs
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-auth-nfs
  namespace: local-llm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: synology-nfs
  volumeName: local-llm-shared-auth-nfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-llm-backend
  namespace: local-llm
  labels:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-llm
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-llm
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: local-llm-backend
      hostAliases:
        - ip: 192.168.5.2
          hostnames:
            - host.lima.internal
      containers:
        - name: backend
          image: ghcr.io/chrischang314/local-llm/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OLLAMA_BACKENDS_FILE
              value: /app/config/backends.json
            - name: AGENT_RUNNER_URL
              value: http://local-llm-agent-runner.local-llm.svc.cluster.local:8080
            - name: WEB_RESEARCH_ENABLED
              value: "true"
            - name: WEB_RESEARCH_PROVIDER
              value: mojeek
            - name: WEB_RESEARCH_FETCH_PAGES
              value: "false"
            - name: SHARED_AUTH_DB
              value: /shared-auth/auth.db
            - name: CORS_ORIGINS
              value: http://localllm.lan,http://projects.lan
            - name: AGENT_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: local-llm-agent-runner-auth
                  key: token
                  optional: true
          volumeMounts:
            - name: ollama-backends
              mountPath: /app/config
              readOnly: true
            - name: chat-data
              mountPath: /app/data
            - name: shared-auth
              mountPath: /shared-auth
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: ollama-backends
          configMap:
            name: ollama-backends
        - name: chat-data
          persistentVolumeClaim:
            claimName: local-llm-chat-data
        - name: shared-auth
          persistentVolumeClaim:
            claimName: shared-auth-nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-llm-chat-data
  namespace: local-llm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: local-llm-backend
  namespace: local-llm
spec:
  selector:
    app.kubernetes.io/name: local-llm
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
